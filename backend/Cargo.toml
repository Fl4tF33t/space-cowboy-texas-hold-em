[workspace]
members = [
    "game",
    "network",
]

resolver = "2"

[workspace.dependencies]
bevy = "0.19.1"
rand = "0.10.3"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3